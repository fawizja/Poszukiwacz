<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1d2a">
  <meta name="description" content="Poszukiwacz — offlinowa gra RPG typu idle">
  <title>Poszukiwacz</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="top-bar" id="top-bar">
      <div class="top-bar__hero">
        <div class="portrait portrait--hero portrait--small" data-portrait="hero"></div>
        <div class="top-bar__info">
          <div class="top-bar__level" id="hdr-level"></div>
          <div class="bar bar--xp"><div class="bar__fill" id="hdr-xp"></div></div>
        </div>
      </div>
      <div class="top-bar__gold"><span class="icon icon--gold" data-icon="gold"></span><span id="hdr-gold">0</span></div>
      <button class="icon-btn" id="btn-settings" type="button"><span class="icon icon--gear" data-icon="gear"></span></button>
    </header>

    <main class="screens" id="screens">
      <section class="screen" id="screen-hero" data-screen="hero"></section>
      <section class="screen" id="screen-combat" data-screen="combat"></section>
      <section class="screen" id="screen-backpack" data-screen="backpack"></section>
      <section class="screen" id="screen-crafting" data-screen="crafting"></section>
      <section class="screen" id="screen-settlement" data-screen="settlement"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root"></div>
  <div class="boot-screen" id="boot-screen"><div class="boot-screen__logo">Poszukiwacz</div></div>

  <script type="module" src="js/main.js"></script>
  <script>
    // Otwarcie pliku bezpośrednio (file://) blokuje moduły ES6 w części przeglądarek.
    // Wtedy ładujemy zbudowaną wersję klasyczną (js/bundle.js).
    window.addEventListener('load', function () {
      if (window.__POSZUKIWACZ_BOOTED) return;
      var s = document.createElement('script');
      s.src = 'js/bundle.js';
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
